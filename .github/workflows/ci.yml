name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pruebas de dominio y RLS (incluye pruebas negativas de la bóveda)
        run: pnpm test
      - name: Tipos
        run: pnpm typecheck
      - name: Build de la PWA
        run: pnpm --filter @insedu/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
